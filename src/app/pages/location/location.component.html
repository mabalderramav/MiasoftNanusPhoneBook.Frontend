<mat-form-field>
  <mat-label>Filter</mat-label>
  <input
    id="filter"
    type="text"
    matInput aria-label="Filter"
    (keyup)="applyFilter($event)"
    placeholder="Ex. Mia" #input />
</mat-form-field>

<div class="mat-shadow-2">
  <table mat-table [dataSource]="dataSource" matSort>

    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> ID</th>
      <td mat-cell *matCellDef="let row"> {{ row.id }}</td>
    </ng-container>

    <!-- Code Column -->
    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> CODE</th>
      <td mat-cell *matCellDef="let row"> {{ row.code }}</td>
    </ng-container>

    <!-- Description Column -->
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> DESCRIPTION</th>
      <td mat-cell *matCellDef="let row"> {{ row.description }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row *matRowDef="let row; columns: displayedColumns;" [attr.data-row-id]="row.id">
    </tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="4">No data matching the filter "{{ input.value }}"</td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[2, 5, 10, 100]" aria-label="Select page of location"></mat-paginator>
</div>
